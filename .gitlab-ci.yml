stages:
  - lint
  - test
  - sast
  - sca
  - secrets
  - build
  - container_scan
  - dast
  - deploy

variables:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  DOCKER_TLS_CERTDIR: "/certs"

default:
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt

lint:
  stage: lint
  script:
    - pip install flake8 black
    - flake8 app/ --max-line-length=120 --exclude=migrations
    - black --check app/

unit_tests:
  stage: test
  script:
    - pip install pytest pytest-cov
    - pytest tests/ --cov=app --cov-report=xml --cov-report=term
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

sast_bandit:
  stage: sast
  script:
    - pip install bandit
    - bandit -r app/ -f json -o bandit-report.json || true
    - bandit -r app/ -ll
  artifacts:
    when: always
    paths:
      - bandit-report.json
    expire_in: 1 week

sast_semgrep:
  stage: sast
  image: returntocorp/semgrep:latest
  before_script: []
  script:
    - semgrep --config=p/python --config=p/owasp-top-ten --config=p/flask
      --json --output=semgrep-report.json app/ || true
    - semgrep --config=p/security-audit --error app/
  artifacts:
    when: always
    paths:
      - semgrep-report.json

sca_pip_audit:
  stage: sca
  script:
    - pip install pip-audit
    - pip-audit --requirement requirements.txt --format json --output pip-audit-report.json || true
    - pip-audit --requirement requirements.txt --strict
  artifacts:
    when: always
    paths:
      - pip-audit-report.json

sca_trivy_fs:
  stage: sca
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  before_script: []
  script:
    - trivy fs --severity HIGH,CRITICAL --format json --output trivy-fs.json .
    - trivy fs --severity CRITICAL --exit-code 1 .
  artifacts:
    when: always
    paths:
      - trivy-fs.json


secret_scan_gitleaks:
  stage: secrets
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  before_script: []
  script:
    - gitleaks detect --source . --report-format json --report-path gitleaks-report.json --verbose
  artifacts:
    when: always
    paths:
      - gitleaks-report.json

build_image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_NAME .
    - docker push $IMAGE_NAME

container_scan_trivy:
  stage: container_scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  before_script: []
  script:
    - trivy image --severity HIGH,CRITICAL --format json --output trivy-image.json $IMAGE_NAME
    - trivy image --severity CRITICAL --exit-code 1 $IMAGE_NAME
  artifacts:
    when: always
    paths:
      - trivy-image.json

dast_zap:
  stage: dast
  image: ghcr.io/zaproxy/zaproxy:stable
  before_script: []
  services:
    - name: $IMAGE_NAME
      alias: app
  variables:
    TARGET_URL: "http://app:5000"
  script:
    - mkdir -p /zap/wrk
    - zap-baseline.py -t $TARGET_URL -J zap-report.json -r zap-report.html || true
  artifacts:
    when: always
    paths:
      - zap-report.json
      - zap-report.html
  allow_failure: true

deploy_prod:
  stage: deploy
  script:
    - echo "Deploy $IMAGE_NAME to production"
    # - kubectl set image deployment/app app=$IMAGE_NAME
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production
